<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cấu hình backend</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --bg:#14121a; --surface:#1c1922; --surface2:#241f2c; --line:#322c3c;
    --ink:#f1ebe1; --muted:#9a9187; --faint:#6b6472;
    --dst:#57c9b5; --warn:#e9b44c; --err:#ff8a99;
    --display:'Space Grotesk', system-ui, sans-serif;
    --body:'Be Vietnam Pro', system-ui, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; background: var(--bg); min-height: 100vh; }
  .app { max-width: 760px; margin: 0 auto; padding: 20px 16px 120px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  h1 { font-family: var(--display); font-size: 22px; margin: 0; }
  a { color: var(--dst); }
  .sub { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .sub code { font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .box { border-radius: 10px; padding: 10px 14px; margin-top: 16px; font-size: 14px; }
  .box.warn { border: 1px solid rgba(233,180,76,.45); background: rgba(233,180,76,.08); color: var(--warn); }
  .box.err { border: 1px solid rgba(255,138,153,.45); background: rgba(255,138,153,.08); color: var(--err); }
  .box.ok { border: 1px solid rgba(87,201,181,.45); background: rgba(87,201,181,.08); color: var(--dst); }
  .box ul { margin: 0; padding-left: 18px; }
  fieldset { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 18px 0 0; padding: 6px 16px 16px; }
  legend { font-family: var(--display); font-weight: 500; padding: 0 6px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  .row { margin-top: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .key { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 6px; }
  .ctl { display: flex; gap: 8px; }
  input, select { flex: 1; min-width: 0; padding: 9px 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; color: var(--ink); font-family: var(--body); font-size: 14px; }
  input:focus-visible, select:focus-visible, .btn:focus-visible { outline: 2px solid var(--dst); outline-offset: 2px; }
  .hint { font-size: 12px; color: var(--faint); margin-top: 4px; }
  .hint.ok { color: var(--dst); } .hint.bad { color: var(--err); }
  .btn { cursor: pointer; border-radius: 9px; padding: 10px 18px; font-family: var(--display); font-weight: 500; font-size: 14px; border: 1px solid transparent; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--dst); color: #0c1512; }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.small { padding: 8px 12px; font-size: 12px; white-space: nowrap; }
  .actions { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(20,18,26,.94); border-top: 1px solid var(--line); }
  .actions .inner { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>⚙ Cấu hình backend</h1>
    <a href="/app">← Console</a>
  </header>
  <p class="sub">Lưu vào <code id="envPath">.env</code>. Thay đổi có hiệu lực sau khi khởi động lại server. Ô key để trống = giữ key cũ.</p>
  <div id="msg"></div>
  <div id="warnings"></div>
  <form id="form" autocomplete="off"></form>
</div>
<div class="actions"><div class="inner">
  <button class="btn btn-ghost" id="save" type="button">Lưu</button>
  <button class="btn btn-primary" id="saveRestart" type="button">Lưu &amp; khởi động lại</button>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") n.textContent = v; else if (v !== undefined) n.setAttribute(k, v);
  }
  n.append(...kids);
  return n;
}

function showMsg(kind, text) {
  $("msg").replaceChildren(text ? el("div", { class: "box " + kind, text }) : "");
}

function showWarnings(list, overrides) {
  const items = [...list];
  if (overrides.length) items.push("Đang bị biến môi trường ghi đè (sửa ở đây sẽ không có tác dụng): " + overrides.join(", "));
  $("warnings").replaceChildren(items.length
    ? el("div", { class: "box warn" }, el("ul", {}, ...items.map((w) => el("li", { text: w }))))
    : "");
}

function render() {
  const form = $("form");
  form.replaceChildren();
  const groups = {};
  for (const f of state.fields) {
    if (!groups[f.group]) {
      groups[f.group] = el("fieldset", {}, el("legend", { text: f.group }));
      form.append(groups[f.group]);
    }
    const id = "f_" + f.key;
    let input;
    if (f.kind === "select") {
      input = el("select", { id, name: f.key }, ...f.options.map((o) => el("option", { value: o, text: o })));
      input.value = f.value;
    } else {
      input = el("input", {
        id, name: f.key,
        type: f.kind === "secret" ? "password" : "text",
        inputmode: f.kind === "number" ? "decimal" : undefined,
        placeholder: f.kind === "secret" ? (f.isSet ? "Đã có: " + f.masked + " (để trống = giữ nguyên)" : "Chưa có key") : "",
      });
      if (f.kind !== "secret") input.value = f.value;
    }
    const ctl = el("div", { class: "ctl" }, input);
    const hint = el("div", { class: "hint", id: "h_" + f.key });
    const provider = { GROQ_API_KEY: "groq", SEALION_API_KEY: "sealion" }[f.key];
    if (provider) {
      const btn = el("button", { class: "btn btn-ghost small", type: "button", text: "Kiểm tra key" });
      btn.onclick = () => testKey(provider, input.value.trim(), hint, btn);
      ctl.append(btn);
    }
    groups[f.group].append(el("div", { class: "row" },
      el("label", { for: id }, f.label, el("span", { class: "key", text: f.key })), ctl, hint));
  }
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "HTTP " + r.status);
  return data;
}

async function load() {
  try {
    state = await api("/api/setup");
  } catch (e) {
    showMsg("err", "Không tải được cấu hình: " + e.message);
    return;
  }
  $("envPath").textContent = state.envPath;
  showWarnings(state.warnings, state.envOverrides);
  render();
}

async function testKey(provider, key, hint, btn) {
  btn.disabled = true;
  hint.className = "hint";
  hint.textContent = "Đang thử dịch một câu…";
  try {
    const r = await api("/api/setup/test-key", { provider, key });
    hint.className = "hint " + (r.ok ? "ok" : "bad");
    hint.textContent = (r.ok ? "✅ " : "❌ ") + r.message;
  } catch (e) {
    hint.className = "hint bad";
    hint.textContent = "❌ " + e.message;
  } finally {
    btn.disabled = false;
  }
}

async function save() {
  const body = {};
  for (const f of state.fields) body[f.key] = $("f_" + f.key).value;
  const r = await api("/api/setup", body);
  showWarnings(r.warnings, state.envOverrides);
  return r;
}

async function waitForServer() {
  for (let i = 0; i < 60; i++) {
    await new Promise((res) => setTimeout(res, 1000));
    try { await api("/api/setup"); return true; } catch (_) { /* still restarting */ }
  }
  return false;
}

$("save").onclick = async () => {
  try {
    await save();
    showMsg("ok", "Đã lưu. Khởi động lại server để áp dụng.");
    await load();
  } catch (e) { showMsg("err", "Lưu thất bại: " + e.message); }
};

$("saveRestart").onclick = async () => {
  const n = state.connectedDevices;
  if (n > 0 && !confirm(`Đang có ${n} thiết bị kết nối. Khởi động lại sẽ ngắt cuộc họp của họ. Tiếp tục?`)) return;
  const buttons = [$("save"), $("saveRestart")];
  buttons.forEach((b) => (b.disabled = true));
  try {
    await save();
    await api("/api/setup/restart", {});
    showMsg("warn", "Đã lưu, đang khởi động lại server…");
    if (await waitForServer()) {
      showMsg("ok", "Server đã chạy lại với cấu hình mới.");
      await load();
    } else {
      showMsg("err", "Server chưa chạy lại sau 60 giây. Kiểm tra cửa sổ console của server.");
    }
  } catch (e) {
    showMsg("err", "Thất bại: " + e.message);
  } finally {
    buttons.forEach((b) => (b.disabled = false));
  }
};

load();
</script>
</body>
</html>
